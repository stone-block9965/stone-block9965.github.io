<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>リンク - stone block</title>
    
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --text: #111111;
            --subtext: #5e6a78;
            --nav-border: rgba(0, 0, 0, 0.08);
            --glass-border: rgba(255, 255, 255, 0.65);
            --shadow: rgba(55, 75, 105, 0.18);
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans JP",
                "Yu Gothic",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(110, 160, 255, 0.45),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(190, 150, 255, 0.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(70, 210, 220, 0.25),
                    transparent 38%
                ),
                linear-gradient(
                    135deg,
                    #edf6ff 0%,
                    #f5efff 50%,
                    #ecfbff 100%
                );

            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(12px);
            z-index: -1;
        }

        body::before {
            width: 35vw;
            height: 35vw;
            left: -10vw;
            top: 48vh;
            background: rgba(90, 150, 255, 0.14);
        }

        body::after {
            width: 30vw;
            height: 30vw;
            right: -10vw;
            top: 55vh;
            background: rgba(150, 110, 255, 0.13);
        }

        /* =========================
           Top navigation
        ========================= */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;

            background: #ffffff;

            border-bottom: 1px solid var(--nav-border);

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.05);
        }

        .nav-inner {
            width: min(1180px, calc(100% - 40px));
            min-height: 68px;

            margin: 0 auto;

            display: flex;
            align-items: center;

            gap: 34px;

            padding-left: 7%;
        }

        .brand {
            color: #000000;
            text-decoration: none;

            font-size: clamp(26px, 3vw, 36px);
            font-weight: 800;

            letter-spacing: -0.055em;
            line-height: 1;

            white-space: nowrap;

            transition: opacity 160ms ease;
        }

        .brand:hover {
            opacity: 0.62;
        }

        .nav-link {
            color: #333333;
            text-decoration: none;

            font-size: 15px;
            font-weight: 500;

            white-space: nowrap;

            transition:
                color 160ms ease,
                opacity 160ms ease;
        }

        .nav-link:hover {
            color: #000000;
            opacity: 0.62;
        }

        .brand:focus-visible,
        .nav-link:focus-visible {
            outline: 3px solid rgba(78, 120, 255, 0.35);
            outline-offset: 5px;
        }

        /* =========================
           Main
        ========================= */

        .container {
            width: min(760px, calc(100% - 40px));
            margin: 0 auto;

            padding: 100px 0 60px;
        }

        .page {
            text-align: center;
        }

        .page-title {
            margin: 0;

            font-size: clamp(56px, 11vw, 100px);
            line-height: 1;

            letter-spacing: -0.065em;

            font-weight: 850;

            color: #000000;
        }

        .page-description {
            margin: 24px auto 0;

            max-width: 600px;

            color: var(--subtext);

            font-size: clamp(15px, 2.5vw, 17px);

            line-height: 1.8;
        }

        .keep-banner {
            margin-top: 30px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           Links
        ========================= */

        .links {
            display: grid;
            gap: 14px;

            margin-top: 52px;
        }

        .glass-button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            min-height: 76px;

            padding: 16px 18px 16px 22px;

            border: 1px solid var(--glass-border);
            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.44),
                    rgba(255, 255, 255, 0.20)
                );

            color: var(--text);
            text-decoration: none;

            box-shadow:
                0 12px 30px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                inset 0 -1px 0 rgba(255, 255, 255, 0.18);

            backdrop-filter:
                blur(20px)
                saturate(160%);

            -webkit-backdrop-filter:
                blur(20px)
                saturate(160%);

            transition:
                transform 160ms ease,
                background 160ms ease,
                box-shadow 160ms ease;
        }

        .glass-button::before {
            content: "";

            position: absolute;
            inset: 1px;

            border-radius: 21px;
            pointer-events: none;

            background:
                linear-gradient(
                    125deg,
                    rgba(255, 255, 255, 0.65),
                    transparent 25%,
                    transparent 72%,
                    rgba(255, 255, 255, 0.18)
                );
        }

        .glass-button:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.57),
                    rgba(255, 255, 255, 0.28)
                );

            box-shadow:
                0 18px 36px rgba(55, 75, 105, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .glass-button:active {
            transform: scale(0.99);
        }

        .glass-button:focus-visible {
            outline: 3px solid rgba(78, 120, 255, 0.35);
            outline-offset: 3px;
        }

        .button-text {
            position: relative;
            z-index: 1;

            text-align: left;
        }

        .button-title {
            display: block;

            font-size: 17px;
            font-weight: 750;
        }

        .button-subtitle {
            display: block;

            margin-top: 3px;

            font-size: 13px;
            color: var(--subtext);
        }

        .arrow {
            position: relative;
            z-index: 1;

            display: grid;
            place-items: center;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.32);
            border: 1px solid rgba(255, 255, 255, 0.62);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.75);

            font-size: 20px;
        }

        footer {
            margin-top: 46px;

            text-align: center;

            font-size: 12px;

            color: rgba(65, 77, 93, 0.65);
        }

        /* =========================
           Mobile
        ========================= */

        @media (max-width: 700px) {
            .nav-inner {
                width: min(100% - 28px, 1180px);

                min-height: 62px;

                gap: 22px;

                padding-left: 2%;
            }

            .brand {
                font-size: 25px;
            }

            .nav-link {
                font-size: 13px;
            }

            .container {
                width: min(100% - 28px, 760px);
                padding-top: 78px;
            }

            .page-title {
                font-size: clamp(52px, 13vw, 80px);
            }
        }

        @media (max-width: 500px) {
            .nav-inner {
                gap: 17px;
                padding-left: 0;
            }

            .brand {
                font-size: 22px;
            }

            .nav-link {
                font-size: 12px;
            }

            .page-title {
                font-size: clamp(44px, 12vw, 68px);
            }

            .glass-button {
                min-height: 70px;
                border-radius: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand,
            .nav-link,
            .glass-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         Navigation
    ========================= -->

    <header class="topbar">

        <nav

        >

            <a class="brand" href="/">

            </a>

            <a class="nav-link" href="/about/">

    <!-- =========================

    <main class="container">

            <a

            <a

            <a

            <a

        <footer>

</body>
</html>
