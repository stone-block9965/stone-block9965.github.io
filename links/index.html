<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>リンク - stone block</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --text: #17202b;
            --subtext: #5e6a78;
            --glass-border: rgba(255, 255, 255, 0.65);
            --shadow: rgba(55, 75, 105, 0.18);
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Noto Sans JP",
                "Yu Gothic",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(110, 160, 255, 0.45),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(190, 150, 255, 0.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(70, 210, 220, 0.25),
                    transparent 38%
                ),
                linear-gradient(
                    135deg,
                    #edf6ff 0%,
                    #f5efff 50%,
                    #ecfbff 100%
                );

            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(12px);
            z-index: -1;
        }

        body::before {
            width: 35vw;
            height: 35vw;
            left: -10vw;
            top: 48vh;
            background: rgba(90, 150, 255, 0.14);
        }

        body::after {
            width: 30vw;
            height: 30vw;
            right: -10vw;
            top: 55vh;
            background: rgba(150, 110, 255, 0.13);
        }

        .container {
            width: min(760px, calc(100% - 40px));
            margin: 0 auto;
            padding: 70px 0 60px;
        }

        .back {
            display: inline-block;
            margin-bottom: 30px;

            color: var(--subtext);
            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .site-name {
            margin: 0 0 10px;

            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.04em;

            color: var(--subtext);
        }

        h1 {
            margin: 0 0 34px;

            font-size: clamp(34px, 6vw, 52px);
            line-height: 1.08;
            letter-spacing: -0.04em;
            font-weight: 800;
        }

        .links {
            display: grid;
            gap: 14px;
        }

        .glass-button {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            min-height: 72px;

            padding: 16px 18px 16px 22px;

            border: 1px solid var(--glass-border);
            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.44),
                    rgba(255, 255, 255, 0.20)
                );

            color: var(--text);
            text-decoration: none;

            box-shadow:
                0 12px 30px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                inset 0 -1px 0 rgba(255, 255, 255, 0.18);

            backdrop-filter:
                blur(20px)
                saturate(160%);

            -webkit-backdrop-filter:
                blur(20px)
                saturate(160%);

            transition:
                transform 160ms ease,
                background 160ms ease,
                box-shadow 160ms ease;
        }

        .glass-button::before {
            content: "";

            position: absolute;
            inset: 1px;

            border-radius: 21px;
            pointer-events: none;

            background:
                linear-gradient(
                    125deg,
                    rgba(255, 255, 255, 0.65),
                    transparent 25%,
                    transparent 72%,
                    rgba(255, 255, 255, 0.18)
                );
        }

        .glass-button:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.57),
                    rgba(255, 255, 255, 0.28)
                );

            box-shadow:
                0 18px 36px rgba(55, 75, 105, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .glass-button:active {
            transform: scale(0.99);
        }

        .glass-button:focus-visible {
            outline: 3px solid rgba(78, 120, 255, 0.35);
            outline-offset: 3px;
        }

        .button-text {
            position: relative;
            z-index: 1;
        }

        .button-title {
            display: block;

            font-size: 17px;
            font-weight: 750;
        }

        .button-subtitle {
            display: block;

            margin-top: 3px;

            font-size: 13px;
            color: var(--subtext);
        }

        .arrow {
            position: relative;
            z-index: 1;

            display: grid;
            place-items: center;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.32);
            border: 1px solid rgba(255, 255, 255, 0.62);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.75);

            font-size: 20px;
        }

        footer {
            margin-top: 34px;

            text-align: center;

            font-size: 12px;

            color: rgba(65, 77, 93, 0.65);
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 28px, 760px);
                padding-top: 50px;
            }

            .glass-button {
                min-height: 68px;
                border-radius: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .glass-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <a class="back" href="/">← ホームに戻る</a>

        <p class="site-name">stone block</p>

        <h1>リンク</h1>

        <nav class="links" aria-label="リンク">

            <a
                class="glass-button"
                href="https://modrinth.com/user/stoneblock9965"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="button-text">
                    <span class="button-title">Modrinth</span>
                    <span class="button-subtitle">
                        Minecraftの制作物
                    </span>
                </span>

                <span class="arrow" aria-hidden="true">
                    →
                </span>
            </a>

            <a
                class="glass-button"
                href="https://www.curseforge.com/members/stone_block9965/projects"
                target="_blank"
                rel="noopener noreferrer"
            >
                <span class="button-text">
                    <span class="button-title">CurseForge</span>
                    <span class="button-subtitle">
                        Minecraftの制作物
                    </span>
                </span>

                <span class="arrow" aria-hidden="true">
                    →
                </span>
            </a>

        </nav>

        <footer>
            © stone block 2026
        </footer>

    </main>

</body>
</html>
