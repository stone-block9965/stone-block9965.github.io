  --on-primary-container:#21005d;
  --secondary:#635a75;
  --on-secondary:#ffffff;
  --secondary-container:rgba(232,222,248,.58);
  --on-secondary-container:#1d192b;
  --tertiary:#7d5260;
  --on-tertiary:#ffffff;
  --tertiary-container:rgba(255,216,228,.56);
  --on-tertiary-container:#31111d;
  --surface:rgba(255,255,255,.42);
  --surface-low:rgba(255,255,255,.32);
  --surface-container:rgba(255,255,255,.38);
  --surface-high:rgba(255,255,255,.48);
  --surface-highest:rgba(255,255,255,.60);
  --on-surface:#1d1b20;
  --on-surface-variant:#49454f;
  --outline:rgba(73,69,79,.38);
  --outline-variant:rgba(121,116,126,.22);
  --inverse-surface:#322f35;
  --inverse-on-surface:#f5eff7;
  --inverse-primary:#d0bcff;
  --cpu:#6750a4;
  --gpu:#9a4563;
  --ok:#625578;
  --glass-highlight:rgba(255,255,255,.58);
  --glass-highlight-soft:rgba(255,255,255,.22);
  --glass-shadow:0 24px 70px rgba(55,39,91,.14),0 8px 28px rgba(55,39,91,.08),inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.10);
  --glass-shadow-strong:0 30px 90px rgba(55,39,91,.20),0 10px 34px rgba(55,39,91,.11),inset 0 1px 0 rgba(255,255,255,.50),inset 0 -2px 0 rgba(255,255,255,.12);
  --glass-blur:32px;
  --glass-saturate:190%;
  --r-xl:34px;
  --r-lg:26px;
  --r-md:20px;
  --r-sm:18px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

    --surface-low:rgba(34,32,39,.48);

    --surface-high:rgba(52,49,59,.60);
    --surface-highest:rgba(64,60,70,.68);
    --on-surface:#e6e0e9;
    --on-surface-variant:#cac4d0;
    --outline:rgba(202,196,208,.34);
    --outline-variant:rgba(147,143,153,.22);
    --inverse-surface:#e6e0e9;
    --inverse-on-surface:#322f35;
    --inverse-primary:#6750a4;
    --cpu:#d0bcff;
    --gpu:#efb8c8;
    --ok:#cdc2dd;
    --glass-highlight:rgba(255,255,255,.20);
    --glass-highlight-soft:rgba(255,255,255,.08);
    --glass-shadow:0 18px 50px rgba(0,0,0,.30),0 4px 18px rgba(0,0,0,.18);
    --glass-shadow-strong:0 26px 70px rgba(0,0,0,.36),0 8px 24px rgba(0,0,0,.22);
    color-scheme:dark;
  }
}

:root[data-theme="dark"]{
  --bg:#111016;
  --primary:#d0bcff;
  --on-primary:#381e72;
  --primary-container:rgba(79,55,139,.62);
  --on-primary-container:#eadcff;
  --secondary:#ccc2dc;
  --on-secondary:#332d41;
  --secondary-container:rgba(74,68,88,.62);
  --on-secondary-container:#e8def8;
  --tertiary:#efb8c8;
  --on-tertiary:#492532;
  --tertiary-container:rgba(99,59,72,.62);
  --on-tertiary-container:#ffd8e4;
  --surface:rgba(38,35,43,.54);
  --surface-low:rgba(34,32,39,.48);
  --surface-container:rgba(41,38,47,.55);
  --surface-high:rgba(52,49,59,.60);
  --surface-highest:rgba(64,60,70,.68);
  --on-surface:#e6e0e9;
  --on-surface-variant:#cac4d0;
  --outline:rgba(202,196,208,.34);
  --outline-variant:rgba(147,143,153,.22);
  --inverse-surface:#e6e0e9;
  --inverse-on-surface:#322f35;
  --inverse-primary:#6750a4;
  --cpu:#d0bcff;
  --gpu:#efb8c8;
  --ok:#cdc2dd;
  --glass-highlight:rgba(255,255,255,.20);
  --glass-highlight-soft:rgba(255,255,255,.08);
  --glass-shadow:0 18px 50px rgba(0,0,0,.30),0 4px 18px rgba(0,0,0,.18);
  --glass-shadow-strong:0 26px 70px rgba(0,0,0,.36),0 8px 24px rgba(0,0,0,.22);

}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

:focus-visible{
  outline:3px solid var(--primary);
  outline-offset:3px;
}

html,body{
  min-height:100%;
  background:transparent !important;
}

body{
  margin:0;
  min-height:100vh;
  background:transparent !important;
  color:var(--on-surface);
  font-family:'Roboto','Noto Sans JP',sans-serif;
  line-height:1.6;
  overflow-x:hidden;
}


/* ===== Full-screen photographic backdrop ===== */
.liquid-backdrop{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:#dfe7ef;
}

.liquid-backdrop picture{
  display:block;
  width:100%;
  height:100%;
}

.liquid-backdrop img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  transform:scale(1.015);
  transform-origin:center;
}
.liquid-backdrop::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(75% 60% at 50% 35%,rgba(255,255,255,.035),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 28%,rgba(40,30,70,.045) 100%);
  mix-blend-mode:soft-light;
}
@media(max-width:600px){
  .liquid-backdrop img{object-position:center center;}
}

.app{
  position:relative;
  z-index:2;
  max-width:820px;
  margin:0 auto;
  padding:28px 16px 56px;
}

/* ===== Title + device type switcher ===== */
.titlebar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 16px;
}

h1{
  flex:1 1 auto;
  min-width:0;
  font-size:clamp(21px,5vw,32px);
  font-weight:900;
  margin:0;
  letter-spacing:-.01em;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

.platform-toggle{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:2px;
  padding:4px;
  border:1px solid rgba(255,255,255,.42);
  border-radius:999px;
  background:rgba(255,255,255,.12);
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.28);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate));
}

.platform-toggle button{
  font:inherit;
  font-size:12.5px;
  font-weight:700;
  white-space:nowrap;
  border:0;
  border-radius:999px;
  padding:8px 12px;
  background:transparent;
  color:var(--on-surface-variant);
  cursor:pointer;
  transition:transform .2s ease,background .25s ease,box-shadow .25s ease,color .25s ease;
}

.platform-toggle button:hover{background:rgba(255,255,255,.20)}
.platform-toggle button:active{transform:scale(.97)}
.platform-toggle button.on{
  color:var(--on-secondary-container);
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.48));
  box-shadow:0 6px 18px rgba(55,70,85,.10),inset 0 1px 0 rgba(255,255,255,.36);
}

h1 b{color:var(--cpu)}
h1 i{color:var(--gpu);font-style:normal}

.lead{
  color:var(--on-surface-variant);
  margin:0 0 20px;
  font-size:14px;
}

.hero,.sel,.rows,.seg,.chips button,select,.plate{
  position:relative;
  isolation:isolate;
  -webkit-backdrop-filter:url(#liquidLens) blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(1.06);
  backdrop-filter:url(#liquidLens) blur(var(--glass-blur)) saturate(var(--glass-saturate)) brightness(1.06);
}

/* The SVG filter is the important part: unlike plain blur, it bends the backdrop. */
.liquid-glass-filter{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}

.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(120% 90% at 12% 0%,rgba(255,255,255,.22),transparent 42%),
    radial-gradient(80% 90% at 95% 100%,rgba(174,131,255,.09),transparent 55%),
    rgba(255,255,255,.09);
  color:var(--on-primary-container);
  border:1px solid rgba(255,255,255,.58);
  border-radius:34px;
  padding:18px 16px 22px;
  box-shadow:
    0 30px 90px rgba(55,39,91,.18),
    0 12px 34px rgba(55,39,91,.10),
    inset 0 1.5px 0 rgba(255,255,255,.72),
    inset 1.5px 0 0 rgba(255,255,255,.28),
    inset 0 -2px 0 rgba(86,63,118,.10),
    inset 0 0 28px rgba(255,255,255,.08);
  transform:translateZ(0);
}

.hero:before,.sel:before,.rows:before,.seg:before,.chips button:before,select:before,.plate:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:inherit;
  background:
    linear-gradient(122deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.14) 14%,transparent 30%),
    linear-gradient(302deg,rgba(255,255,255,.16) 0%,transparent 24%),
    radial-gradient(80% 45% at 50% 0%,rgba(255,255,255,.18),transparent 70%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 1px 0 0 rgba(255,255,255,.12),
    inset -1px 0 0 rgba(150,130,190,.10);
  mix-blend-mode:screen;
  opacity:.95;
}

.hero:after{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  pointer-events:none;
  background:
    radial-gradient(34% 22% at 12% 8%,rgba(255,255,255,.50),transparent 74%),
    radial-gradient(32% 20% at 88% 94%,rgba(120,150,255,.11),transparent 76%),
    linear-gradient(90deg,rgba(255,255,255,.18),transparent 10%,transparent 90%,rgba(255,255,255,.11));
  filter:blur(.4px);
  opacity:.8;
}

.sel:after,.rows:after{
  content:"";
  position:absolute;
  inset:-1px;
  pointer-events:none;
  border-radius:inherit;
  background:
    radial-gradient(55% 30% at 0% 0%,rgba(255,255,255,.28),transparent 72%),
    radial-gradient(55% 26% at 100% 100%,rgba(190,160,255,.10),transparent 74%),
    linear-gradient(90deg,rgba(255,255,255,.13),transparent 11%,transparent 89%,rgba(255,255,255,.09));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -1px 0 rgba(72,54,105,.10);
  mix-blend-mode:screen;
}

@media (prefers-color-scheme:dark){
  .hero{background:linear-gradient(145deg,rgba(83,57,145,.72),rgba(79,55,139,.38));border-color:rgba(255,255,255,.13)}
}

:root[data-theme="dark"] .hero{background:linear-gradient(145deg,rgba(83,57,145,.72),rgba(79,55,139,.38));border-color:rgba(255,255,255,.13)}

.ctx{text-align:center;font-size:13px;font-weight:500;position:relative;z-index:1}
.ctx b{font-weight:900}

.stage{position:relative;height:280px;margin:0 2px;z-index:1}

.beam{
  position:absolute;
  left:0;
  right:0;
  top:196px;
  height:8px;
  border-radius:5px;
  background:linear-gradient(90deg,rgba(53,47,61,.86),rgba(82,73,93,.92),rgba(53,47,61,.86));
  box-shadow:0 3px 10px rgba(40,30,55,.18),inset 0 1px 0 rgba(255,255,255,.24);
  transform:rotate(var(--t,0deg));
  transition:transform .7s cubic-bezier(.3,1.5,.5,1);
}

.plate{
  position:absolute;
  bottom:10px;
  width:47%;
  text-align:center;
  padding:12px 8px 10px;
  border-radius:24px;
  border:1px solid rgba(255,255,255,.44);
  background:rgba(255,255,255,.13);
  box-shadow:
    0 14px 34px rgba(38,28,56,.16),
    inset 0 1.5px 0 rgba(255,255,255,.54),
    inset 1px 0 0 rgba(255,255,255,.20),
    inset 0 -2px 0 rgba(60,40,85,.10),
    inset 0 0 20px rgba(255,255,255,.10);
  overflow:hidden;
  transform:rotate(calc(var(--t,0deg) * -1)) translateZ(0);
  transition:transform .7s cubic-bezier(.3,1.5,.5,1);
}

.plate.l{left:0;background:linear-gradient(145deg,rgba(122,98,191,.46),rgba(103,80,164,.18));color:var(--on-primary)}
.plate.r{right:0;background:linear-gradient(145deg,rgba(191,111,143,.42),rgba(154,69,99,.17));color:var(--on-tertiary)}
.plate small{display:block;font-weight:700;font-size:12px}
.plate .n{font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.10)}
.plate .m{font-size:12.5px;font-weight:700;line-height:1.3;margin-top:2px;min-height:32px}
.plate .g{font-size:11px;opacity:.85}

.fulcrum{
  position:absolute;
  left:50%;
  top:204px;
  width:56px;
  height:60px;
  margin-left:-28px;
  background:linear-gradient(145deg,rgba(99,90,117,.85),rgba(99,90,117,.60));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 24px rgba(43,34,59,.15),inset 0 1px 0 rgba(255,255,255,.26);
  clip-path:polygon(50% 0,100% 100%,0 100%);
}

.verdict{text-align:center;position:relative;z-index:1}
.verdict h2{font-size:clamp(21px,5.5vw,28px);font-weight:900;margin:0}
.verdict p{margin:2px 0 0;font-size:13px}
.cpu-c{color:var(--cpu)}
.gpu-c{color:var(--gpu)}
.ok-c{color:var(--on-primary-container)}
.incident-c{color:#b3261e;text-shadow:0 0 18px rgba(179,38,30,.18)}

.rig{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0;
}

.sel{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.38);
  border-radius:26px;
  padding:16px;
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.44),inset 0 -1px 0 rgba(255,255,255,.10),inset 8px 8px 24px rgba(255,255,255,.07);
}

.sel:hover{transform:translateY(-2px) scale(1.002);box-shadow:0 22px 52px rgba(55,39,91,.14),inset 0 1px 0 var(--glass-highlight)}

.sel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;position:relative;z-index:1}
.sel-head label{font-weight:700;font-size:13px;color:var(--c);display:block;margin:0}
.gpu-tgp-note{display:none;flex:1;min-width:0;margin-left:auto;text-align:right;font-size:10px;line-height:1.3;font-weight:600;color:var(--on-surface-variant);opacity:.92}
.gpu-tgp-note.show{display:block}
.w{position:relative;z-index:1}

.cpu-vendor-toggle{
  display:inline-flex;
  align-items:center;
  gap:1px;
  padding:2px;
  border:1px solid rgba(255,255,255,.36);
  border-radius:999px;
  background:rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),0 4px 12px rgba(55,70,85,.06);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  backdrop-filter:blur(18px) saturate(170%);
}

.cpu-vendor-toggle button{
  font:inherit;
  font-size:11px;
  font-weight:700;
  border:0;
  border-radius:999px;
  padding:4px 9px;
  background:transparent;
  color:var(--on-surface-variant);
  cursor:pointer;
  transition:transform .18s ease,background .22s ease,box-shadow .22s ease,color .22s ease;
}
.cpu-vendor-toggle button:hover{background:rgba(255,255,255,.18)}
.cpu-vendor-toggle button:active{transform:scale(.96)}
.cpu-vendor-toggle button.on{
  color:var(--on-surface);
  background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.46));
  box-shadow:0 4px 12px rgba(55,70,85,.10),inset 0 1px 0 rgba(255,255,255,.34);
}
.w:after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-6px;border:solid var(--on-surface-variant);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}

select{
  width:100%;
  appearance:none;
  font:inherit;
  font-weight:500;
  font-size:14px;
  padding:14px 42px 14px 16px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.42);
  background:rgba(255,255,255,.075);
  color:var(--on-surface);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.52),inset 1px 0 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(70,50,100,.08),0 8px 24px rgba(62,42,95,.07);
  cursor:pointer;
}

@media (prefers-color-scheme:dark){select{background:rgba(255,255,255,.07)}}
:root[data-theme="dark"] select{background:rgba(255,255,255,.07)}
select:hover{background:rgba(255,255,255,.34)}
select:focus{outline:none;border:2px solid var(--primary);padding:13px 39px 13px 13px;box-shadow:0 0 0 4px rgba(103,80,164,.14),inset 0 1px 0 rgba(255,255,255,.22)}

.sel small{display:block;color:var(--on-surface-variant);font-size:12px;margin-top:8px;position:relative;z-index:1}
.lab{font-size:12px;font-weight:700;color:var(--on-surface-variant);margin:16px 0 8px}

.seg{
  display:inline-flex;
  padding:4px;
  gap:2px;
  border:1px solid rgba(255,255,255,.42);
  border-radius:999px;
  background:rgba(255,255,255,.12);
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.26);
}

.seg button{
  position:relative;
  font:inherit;
  font-weight:500;
  font-size:14px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:var(--on-surface);
  padding:9px 18px;
  cursor:pointer;
  transition:transform .2s ease,background .25s ease,box-shadow .25s ease,color .25s ease;
}

.seg button:hover{background:rgba(255,255,255,.22)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:linear-gradient(145deg,rgba(232,222,248,.78),rgba(232,222,248,.48));color:var(--on-secondary-container);font-weight:700;box-shadow:0 6px 18px rgba(76,58,105,.10),inset 0 1px 0 rgba(255,255,255,.30)}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chips button{
  position:relative;
  font:inherit;
  font-weight:500;
  font-size:13.5px;
  border:1px solid rgba(255,255,255,.42);
  background:rgba(255,255,255,.065);
  color:var(--on-surface-variant);
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .2s ease,background .25s ease,box-shadow .25s ease,border-color .25s ease,color .25s ease;
}

.chips button:hover{background:rgba(255,255,255,.34);transform:translateY(-1px)}
.chips button:active{transform:scale(.97)}
.chips button.on{background:linear-gradient(145deg,rgba(232,222,248,.78),rgba(232,222,248,.46));border-color:rgba(255,255,255,.34);color:var(--on-secondary-container);font-weight:700;box-shadow:0 7px 18px rgba(76,58,105,.10),inset 0 1px 0 rgba(255,255,255,.30)}

.rows{
  position:relative;
  overflow:hidden;
  margin-top:18px;
  padding:8px;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.38);
  border-radius:26px;
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.44),inset 0 -1px 0 rgba(255,255,255,.10),inset 8px 8px 24px rgba(255,255,255,.07);
}

.row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 84px;gap:12px;align-items:center;padding:12px;border-radius:22px;transition:background .25s ease,transform .25s ease}
.row.on{background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.14));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.row:hover{background:rgba(255,255,255,.17)}
.row .t{font-size:13px;font-weight:700}

.track{
  position:relative;
  height:10px;
  border-radius:6px;
  background:rgba(110,100,122,.13);
  box-shadow:inset 0 1px 3px rgba(50,36,70,.12),0 1px 0 rgba(255,255,255,.18);
  overflow:visible;
}

.track:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--outline);box-shadow:0 0 5px rgba(70,58,84,.16)}
.fill{position:absolute;top:0;bottom:0;border-radius:6px;transition:all .5s;box-shadow:0 1px 7px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.20)}
.row .v{text-align:right;font-size:12.5px;font-weight:700}

@media(max-width:600px){
  .app{padding-left:12px;padding-right:12px}
  .titlebar{gap:8px}
  .platform-toggle{padding:3px;gap:1px}
  .platform-toggle button{font-size:11px;padding:7px 8px}
  .cpu-vendor-toggle button{font-size:10.5px;padding:4px 8px}
  .gpu-tgp-note{font-size:9px;max-width:62%;}
  .rig{grid-template-columns:1fr}
  .row{grid-template-columns:82px 1fr 68px;gap:8px}
  .plate .m{font-size:11.5px}
  .seg button{padding-inline:15px}
}

@keyframes liquidSheen{
  0%,100%{transform:translateX(-24%) translateY(-4%) rotate(-8deg);opacity:.18;}
  50%{transform:translateX(26%) translateY(3%) rotate(-3deg);opacity:.34;}
}

.hero:after{animation:liquidSheen 9s ease-in-out infinite;}

@media(prefers-reduced-motion:reduce){
  .beam,.plate,.fill,.seg button,.chips button,.sel,.row,.platform-toggle button{transition:none}
  .hero:after{animation:none}
}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .hero,.sel,.rows,.seg,.chips button,select{
  isolation:isolate;background:var(--surface-container)}
}



/* v4: remove the remaining Material 3 Expressive purple/pink palette from the key UI accents */
:root{
  --cpu:#31566e;
  --gpu:#2f7076;
  --ok:#52636c;
}

h1 b{
  color:transparent;
  background:linear-gradient(90deg,#31566e 0%,#3b6b82 52%,#2f7076 100%);
  -webkit-background-clip:text;
  background-clip:text;
}
h1 i{
  color:transparent;
  background:linear-gradient(90deg,#3b6b82 0%,#2f7076 100%);
  -webkit-background-clip:text;
  background-clip:text;
}

.plate.l,
.plate.r{
  color:#f9fcff;
  background:
    linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08)),
    rgba(255,255,255,.10);
}
.plate.l{
  box-shadow:
    0 14px 34px rgba(25,65,90,.16),
    inset 0 1.5px 0 rgba(255,255,255,.62),
    inset 1px 0 0 rgba(168,220,245,.28),
    inset 0 -2px 0 rgba(35,82,105,.10),
    inset 0 0 22px rgba(151,214,244,.10);
}
.plate.r{
  box-shadow:
    0 14px 34px rgba(25,75,78,.15),
    inset 0 1.5px 0 rgba(255,255,255,.62),
    inset 1px 0 0 rgba(165,238,229,.28),
    inset 0 -2px 0 rgba(34,91,91,.10),
    inset 0 0 22px rgba(129,224,213,.10);
}

.hero{
  color:#1c2730;
  background:
    radial-gradient(120% 90% at 12% 0%,rgba(255,255,255,.19),transparent 42%),
    radial-gradient(80% 90% at 95% 100%,rgba(93,190,206,.055),transparent 55%),
    rgba(255,255,255,.075);
}

.sel:after,.rows:after{
  background:
    radial-gradient(55% 30% at 0% 0%,rgba(255,255,255,.28),transparent 72%),
    radial-gradient(55% 26% at 100% 100%,rgba(117,209,215,.07),transparent 74%),

@media (prefers-color-scheme:dark){

    radial-gradient(120% 90% at 12% 0%,rgba(255,255,255,.12),transparent 42%),

  border-color:rgba(255,255,255,.18);
}


/* ===== Keyboard + touch/orientation gag popup ===== */
.shortcut-toast{
  white-space:pre-line;
  position:fixed;
  left:50%;
  top:50%;
  z-index:20;
  width:min(82vw,680px);
  max-width:calc(100vw - 32px);
  padding:28px 34px;
  box-sizing:border-box;
  border:1.5px solid rgba(255,255,255,.62);
  border-radius:30px;
  background:
    radial-gradient(120% 140% at 18% 8%,rgba(255,255,255,.58),transparent 38%),
    radial-gradient(100% 120% at 92% 100%,rgba(119,225,255,.22),transparent 52%),
    rgba(235,247,251,.36);
  color:var(--on-surface);
  box-shadow:
    0 22px 70px rgba(18,42,58,.24),
    inset 0 1px 0 rgba(255,255,255,.72),
    inset 0 -1px 0 rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  backdrop-filter:blur(28px) saturate(190%);
  text-align:center;
  font-size:clamp(20px,3.1vw,34px);
  font-weight:900;
  letter-spacing:.02em;
  line-height:1.5;
  opacity:0;
  transform:translate(-50%,-50%) scale(.90);
  pointer-events:none;
  transition:opacity .22s ease,transform .22s cubic-bezier(.2,.8,.2,1);
}
.shortcut-toast.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* タイトル連打専用：中央からポンッと飛び出す小ネタ演出 */
@keyframes titleGagPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.45) rotate(-2deg);
    filter:blur(10px);
  }
  55%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.075) rotate(.4deg);
    filter:blur(0);
  }
  76%{
    transform:translate(-50%,-50%) scale(.965) rotate(-.18deg);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1) rotate(0);
    filter:blur(0);
  }
}
.shortcut-toast.title-gag-pop{
  animation:titleGagPop .58s cubic-bezier(.22,.86,.2,1) both;
}

/* 軽めの小ネタ用：前の「下から出る」位置を復活させつつ、少しだけ大きく。 */
.shortcut-toast.bottom-gag{
  top:auto;
  bottom:28px;
  width:min(88vw,600px);
  padding:17px 24px;
  border-radius:24px;
  font-size:clamp(15px,2vw,20px);
  line-height:1.45;
  transform:translate(-50%,26px) scale(.88);
  transition:opacity .24s ease,transform .48s cubic-bezier(.16,1.35,.3,1);
}
.shortcut-toast.bottom-gag.show{
  transform:translate(-50%,0) scale(1);
}

@media(max-width:600px){
  .shortcut-toast{
    width:min(88vw,560px);
    max-width:calc(100vw - 24px);
    padding:24px 22px;
    border-radius:26px;
    font-size:clamp(18px,5.3vw,28px);
    line-height:1.45;
  }
  .shortcut-toast.bottom-gag{
    bottom:22px;
    width:min(92vw,560px);
    max-width:calc(100vw - 20px);
    padding:15px 18px;
    border-radius:22px;
    font-size:clamp(14px,4.2vw,18px);
  }
}
@media(prefers-reduced-motion:reduce){
  .shortcut-toast{transition:none}
}

const RES=["1080p","1440p","4K"];

const flat=(D,p)=>D.flatMap(([g,a])=>a.map(x=>
  p
    ? {g,n:x[0],v:x[1],s:x.slice(2)}
    : {g,n:x[0],v:"",s:[x[1]],e:x[2]}
));

function cpuVendorOfGroup(group){
  const firstModel=group?.[1]?.[0]?.[0] || "";
  return /^(Ryzen|Threadripper|Athlon)\b/i.test(firstModel) ? "AMD" : "Intel";
}

function cpuDataForVendor(D,vendor){
  return D.filter(group=>cpuVendorOfGroup(group)===vendor);
}

const PLATFORM={
  desktop:{
    label:"デスクトップ",
    cpu:CPU,
    gpu:GPU,
    defaults:{
      cpuVendor:"AMD",
      cpuByVendor:{
        AMD:"Ryzen 7 9800X3D",
        Intel:"Core Ultra 7 270K Plus"
      },
      g:"RTX 5070"
    }
  },
  laptop:{
    label:"ノート",
    cpu:LAPTOP_CPU,
    gpu:LAPTOP_GPU,
    defaults:{
      cpuVendor:"AMD",
      cpuByVendor:{
        AMD:"Ryzen 9 9955HX3D",
        Intel:"Core Ultra X9 388H"
      },
      g:"GeForce RTX 5070 Ti Laptop GPU"
    }
  }
};

const lastSelections={
  desktop:{
    cpuVendor:PLATFORM.desktop.defaults.cpuVendor,
    cpu:{...PLATFORM.desktop.defaults.cpuByVendor},
    g:PLATFORM.desktop.defaults.g
  },
  laptop:{
    cpuVendor:PLATFORM.laptop.defaults.cpuVendor,
    cpu:{...PLATFORM.laptop.defaults.cpuByVendor},
    g:PLATFORM.laptop.defaults.g
  }
};

let S={
  p:"desktop",
  cpuVendor:lastSelections.desktop.cpuVendor,
  c:lastSelections.desktop.cpu[lastSelections.desktop.cpuVendor],
  g:lastSelections.desktop.g,
  r:1,
  i:0
};

let C=flat(cpuDataForVendor(PLATFORM.desktop.cpu,S.cpuVendor),0);
let G=flat(PLATFORM.desktop.gpu,1);

const $=id=>document.getElementById(id);

function fill(sel,D,cur){
  sel.innerHTML=D.map(([g,a])=>
    `<optgroup label="${g}">${
      a.map(x=>
        `<option${x[0]===cur?" selected":""}>${x[0]}</option>`
      ).join("")
    }</optgroup>`
  ).join("");
}

const TOL=15;

function calc(c,g,wc){
  const cs=c.s[0];
  const gs=g.s[S.r];

  if(!Number.isFinite(gs))
    return{missing:true};

  const d=Math.abs(cs-gs);
  const b=Math.sqrt(wc/(1-wc));
  const r=(cs/gs)/b;
  const side=r<1?"c":"g";
  const raw=(r<1?1-r:1-1/r)*100;

  if(d<=TOL)
    return{
      side,
      gap:0,
      bal:true,
      d
    };

  return{
    side,
    gap:raw*Math.min(1,(d-TOL)/TOL),
    bal:false,
    d
  };
}

function label(x){
  if(x.bal)
    return{
      t:"ほぼ完璧なバランス",
      k:"ok-c"
    };

  const w=x.side==="c"?"CPU":"GPU";
  const k=x.side==="c"?"cpu-c":"gpu-c";

  // 性能差が極端な場合は、もはや通常のボトルネック表示ではなく「事件」。
  if(x.gap>=70)
    return{
      t:"これはボトルネックというより事件です",
      k:"incident-c"
    };

  return{
    t:w+(x.gap<=20
      ?"がわずかにボトルネック"
      :x.gap<=40
        ?"がボトルネック気味"
        :"が強くボトルネック"),
    k
  };
}

function setPlatform(mode){
  if(!PLATFORM[mode]) return;

  lastSelections[S.p].cpu[S.cpuVendor]=S.c;
  lastSelections[S.p].cpuVendor=S.cpuVendor;
  lastSelections[S.p].g=S.g;

  S.p=mode;
  S.cpuVendor=lastSelections[mode].cpuVendor;
  C=flat(cpuDataForVendor(PLATFORM[mode].cpu,S.cpuVendor),0);
  G=flat(PLATFORM[mode].gpu,1);

  const savedCpu=lastSelections[mode].cpu[S.cpuVendor];
  const defaultCpu=PLATFORM[mode].defaults.cpuByVendor[S.cpuVendor];
  S.c=C.some(x=>x.n===savedCpu)
    ?savedCpu
    :C.some(x=>x.n===defaultCpu)
      ?defaultCpu
      :C[0]?.n;
  S.g=G.some(x=>x.n===lastSelections[mode].g)
    ?lastSelections[mode].g
    :PLATFORM[mode].defaults.g;

  fill($('cpu'),cpuDataForVendor(PLATFORM[mode].cpu,S.cpuVendor),S.c);
  fill($('gpu'),PLATFORM[mode].gpu,S.g);

  document.querySelectorAll('#platform button').forEach(b=>
    b.classList.toggle('on',b.dataset.platform===S.p)
  );

  render();
}

function setCpuVendor(vendor){
  if(vendor!=="AMD" && vendor!=="Intel") return;

  lastSelections[S.p].cpu[S.cpuVendor]=S.c;

  S.cpuVendor=vendor;
  const data=cpuDataForVendor(PLATFORM[S.p].cpu,S.cpuVendor);
  C=flat(data,0);

  const savedCpu=lastSelections[S.p].cpu[S.cpuVendor];
  const defaultCpu=PLATFORM[S.p].defaults.cpuByVendor[S.cpuVendor];
  S.c=C.some(x=>x.n===savedCpu)
    ?savedCpu
    :C.some(x=>x.n===defaultCpu)
      ?defaultCpu
      :C[0]?.n;

  lastSelections[S.p].cpuVendor=S.cpuVendor;
  lastSelections[S.p].cpu[S.cpuVendor]=S.c;

  fill($('cpu'),data,S.c);
  render();
}

function render(){
  const c=C.find(x=>x.n===S.c);
  const g=G.find(x=>x.n===S.g);
  const gm=GAMES[S.i];

  const x=calc(c,g,gm[1][S.r]);

  $("ctx").innerHTML=`<b>${gm[0]}</b> を ${RES[S.r]} で遊ぶ場合`;

  $("cs").textContent=c.s[0].toFixed(1);
  $("cn").textContent=c.n;
  $("cg").textContent=c.g;

  $("gs").textContent=Number.isFinite(g.s[S.r])?g.s[S.r].toFixed(1):"—";
  $("gn").textContent=g.n;
  $("gg").textContent=g.g;

  if(x.missing){
    $("beam").style.setProperty("--t","0deg");
    $("vt").textContent="実測データなし";
    $("vt").className="";
    $("vs").textContent=`${g.n} の ${RES[S.r]} 実測値をこのデータセットでは掲載していません`;
  }else{
    const L=label(x);
    const t=x.bal
    ?Math.min(x.d/TOL,1)*.8
    :Math.min(x.gap/50,1)*10;

  $("beam").style.setProperty(
    "--t",
    (x.side==="g"?t:-t).toFixed(1)+"deg"
  );

    $("vt").textContent=L.t;
    $("vt").className=L.k;

    $("vs").textContent=x.bal
      ?"CPUとGPUの指数差は"+x.d.toFixed(1)+"(誤差15以内)"
      :(x.side==="c"?"CPU":"GPU")+"の余力が相手より約"+x.gap.toFixed(0)+"%少ない状態";
  }

  $("cpuG").textContent=c.g+(c.e?"  推定値":"");
  $("gpuG").textContent=g.g+"  VRAM "+g.v;

  const gpuTgpNote=$("gpuTgpNote");
  if(S.p==="laptop") {
    gpuTgpNote.textContent=`同じ${g.n}でもTGPにより性能が変わります`;
    gpuTgpNote.classList.add("show");
  }else{
    gpuTgpNote.textContent="";
    gpuTgpNote.classList.remove("show");
  }

  // FHDなのに高性能な構成になった瞬間だけ、下から少し大きめの通知。
  const cpuFhdScore=Number(c?.s?.[0]);
  const gpuFhdScore=Number(g?.s?.[0]);
  const highSpecFhd=S.r===0 && (cpuFhdScore>=90 || gpuFhdScore>=65);
  if(previousHighSpecFhd!==null && !previousHighSpecFhd && highSpecFhd){
    showBottomToast("そのスペックでFHDなのもったいなくね？WQHDにしたほうがいいよ", 3200);
  }
  previousHighSpecFhd=highSpecFhd;

  // 4Kなのにかなり控えめな性能なら「それで4K…？」。
  const lowSpec4k=S.r===2 && (cpuFhdScore<=40 || gpuFhdScore<=37.5);
  if(!previousLowSpec4k && lowSpec4k){
    showBottomToast("それで4K…？", 2200);
  }
  previousLowSpec4k=lowSpec4k;

  document.querySelectorAll("#platform button").forEach(b=>{
    const on=b.dataset.platform===S.p;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",String(on));
  });

  document.querySelectorAll("#cpuVendor button").forEach(b=>{
    const on=b.dataset.vendor===S.cpuVendor;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",String(on));
  });

  document.querySelectorAll("#seg button").forEach(b=>
    b.classList.toggle("on",+b.dataset.r===S.r)
  );

  document.querySelectorAll("#chips button").forEach((b,i)=>
    b.classList.toggle("on",i===S.i)
  );

  $("rows").innerHTML=GAMES.map((m,i)=>{
    const y=calc(c,g,m[1][S.r]);
    if(y.missing)
      return`
        <div class="row${i===S.i?" on":""}">
          <div class="t">${m[0]}</div>
          <div class="track"></div>
          <div class="v">実測データなし</div>
        </div>
      `;

    const l=label(y);
    const w=Math.min(y.gap,60)/60*50;
    const ok=y.bal;

    const st=ok
      ?`left:calc(50% - 3px);width:6px;background:var(--ok)`
      :y.side==="c"
        ?`right:50%;width:${w}%;background:var(--cpu)`
        :`left:50%;width:${w}%;background:var(--gpu)`;

    return`
      <div class="row${i===S.i?" on":""}">
        <div class="t">${m[0]}</div>
        <div class="track">
          <div class="fill" style="${st}"></div>
        </div>
        <div class="v ${l.k}">
          ${ok
            ?"バランス"
            :(y.side==="c"
              ?"CPU "
              :"GPU ")+y.gap.toFixed(0)+"%"
          }
        </div>
      </div>
    `;
  }).join("");
}

fill($("cpu"),cpuDataForVendor(PLATFORM[S.p].cpu,S.cpuVendor),S.c);
fill($("gpu"),PLATFORM[S.p].gpu,S.g);

$("chips").innerHTML=GAMES.map((m,i)=>
  `<button data-i="${i}">${m[0]}</button>`
).join("");

$("cpu").onchange=e=>{
  S.c=e.target.value;
  lastSelections[S.p].cpu[S.cpuVendor]=S.c;
  render();
};

$("cpuVendor").onclick=e=>{
  const btn=e.target.closest("button[data-vendor]");
  if(!btn) return;
  setCpuVendor(btn.dataset.vendor);
};

$("gpu").onchange=e=>{
  S.g=e.target.value;
  lastSelections[S.p].g=S.g;
  render();
};

$("platform").onclick=e=>{
  const btn=e.target.closest("button[data-platform]");
  if(!btn) return;
  setPlatform(btn.dataset.platform);
};

$("seg").onclick=e=>{
  if(e.target.dataset.r){
    S.r=+e.target.dataset.r;
    render();

    if(S.p==="laptop" && S.r===2){
      showBottomToast("ノートなのに4Kのやつ持ってんの…？金持ってんなー、もし持ってなかったらできるわけねーだろ\nえ、外部モニター？知らんよ(？)", 4200);
    }
  }
};

$("chips").onclick=e=>{
  if(e.target.dataset.i){
    S.i=+e.target.dataset.i;
    render();
  }
};


// ===== Keyboard + touch/orientation gags =====
const shortcutToast = $("shortcutToast");
const defaultTitle = document.title;
let toastTimer = null;
let previousHighSpecFhd = null;
let previousLowSpec4k = false;

// ===== Tab/activity gags =====
const ACTIVE_VIEW_GAG_DELAY = 5 * 60 * 1000; // 5分間このタブを見続けたら発動
const AWAY_RETURN_GAG_DELAY = 10 * 60 * 1000; // 10分以上離れて戻ったら発動
let activeViewTimer = null;
let awayStartedAt = null;
let activeViewGagShown = false;

function isTabVisible(){
  return document.visibilityState === "visible";
}

function formatAwayDuration(ms){
  const totalSeconds=Math.floor(ms/1000);
  const totalMinutes=Math.floor(totalSeconds/60);
  const hours=Math.floor(totalMinutes/60);
  const minutes=totalMinutes%60;
  const seconds=totalSeconds%60;

  if(hours>0){
    return seconds>0
      ?`${hours}時間${minutes}分${seconds}秒`
      :minutes>0
        ?`${hours}時間${minutes}分`
        :`${hours}時間`;
  }
  if(totalMinutes>0){
    return seconds>0 ? `${totalMinutes}分${seconds}秒` : `${totalMinutes}分`;
  }
  return `${Math.max(1,totalSeconds)}秒`;
}

function stopActiveViewTimer(){
  clearTimeout(activeViewTimer);
  activeViewTimer=null;
}

function startActiveViewTimer(){
  stopActiveViewTimer();
  if(activeViewGagShown || !isTabVisible()) return;

  activeViewTimer=setTimeout(()=>{
    if(!activeViewGagShown && isTabVisible()){
      showShortcutToast("何してん、放置？それとも悩んでる？\n画面の前にいますかー？", 4200);
      activeViewGagShown=true;
    }
  }, ACTIVE_VIEW_GAG_DELAY);
}

function noteTabAway(){
  if(awayStartedAt===null){
    awayStartedAt=Date.now();
  }
  stopActiveViewTimer();
}

function noteTabReturn(){
  if(!isTabVisible()) return;

  if(awayStartedAt!==null){
    const awayMs=Date.now()-awayStartedAt;
    if(awayMs>=AWAY_RETURN_GAG_DELAY){
      showBottomToast(`${formatAwayDuration(awayMs)}ぶりに戻ってきた、久しぶり(？)`, 3000);
    }
    awayStartedAt=null;
  }

  startActiveViewTimer();
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden") noteTabAway();
  else noteTabReturn();
});

window.addEventListener("blur", ()=>{
  // タブを表示したまま別アプリ/ウィンドウへ移った場合も「見ていない」とみなす。
  noteTabAway();
});

window.addEventListener("focus", ()=>{
  noteTabReturn();
});

function clearToastModes(){
  shortcutToast.classList.remove("title-gag-pop", "bottom-gag");
}

function showShortcutToast(message, duration=1400){
  shortcutToast.textContent = message;
  clearToastModes();
  shortcutToast.classList.add("show");
  clearTimeout(toastTimer);
  if(duration > 0){
    toastTimer = setTimeout(() => {
      shortcutToast.classList.remove("show");
      clearToastModes();
    }, duration);
  }
}

function showBottomToast(message, duration=3000){
  shortcutToast.textContent = message;
  clearToastModes();
  shortcutToast.classList.remove("show");
  void shortcutToast.offsetWidth;
  shortcutToast.classList.add("bottom-gag", "show");

  clearTimeout(toastTimer);
  if(duration > 0){
    toastTimer = setTimeout(() => {
      shortcutToast.classList.remove("show");
      clearToastModes();
    }, duration);
  }
}

function showTitleGagToast(message, duration=1800){
  shortcutToast.textContent = message;
  clearToastModes();
  // 同じクラスを連続で付けてもアニメーションが毎回再生されるように再レイアウトさせる。
  void shortcutToast.offsetWidth;
  shortcutToast.classList.add("show", "title-gag-pop");

  clearTimeout(toastTimer);
  if(duration > 0){
    toastTimer = setTimeout(() => {
      shortcutToast.classList.remove("show");
      clearToastModes();
    }, duration);
  }
}

function hideShortcutToast(){
  clearTimeout(toastTimer);
  toastTimer = null;
  shortcutToast.classList.remove("show");
  clearToastModes();
}

document.addEventListener("keydown", e => {
  // Ctrl単体を押した瞬間だけ小ネタ表示。
  // Ctrl+Tはブラウザ標準のショートカットを邪魔せず、タブ名だけ変更する。
  if(e.key === "Control" && !e.repeat){
    showShortcutToast("タブ消したりしないよね…？", 0);
    return;
  }

  if(e.ctrlKey && !e.altKey && !e.metaKey && e.key.toLowerCase() === "t"){
    document.title = "新しいタブ開くな！！";
    showShortcutToast("新しいタブ開くな！！");
  }
});

document.addEventListener("keyup", e => {
  if(e.key === "Control") hideShortcutToast();
});

// ウィンドウ切替などでCtrlのkeyupを取りこぼしても表示を残さない。
window.addEventListener("blur", hideShortcutToast);

// ===== Title tap/click gag =====
const titleGag = $("titleGag");
let titleTapCount = 0;
let titleTapTimer = null;

titleGag.addEventListener("click", () => {
  // 20回到達後はカウントを20以上で保持し、それ以降は何も起こさない。
  if(titleTapCount >= 20) return;

  titleTapCount += 1;
  clearTimeout(titleTapTimer);

  if(titleTapCount === 5){
    showTitleGagToast("そこを押しても何も起こらんよ", 1800);
  } else if(titleTapCount === 10){
    showTitleGagToast("何回押してん()\n何回押してもバランス良くならんよ？", 2600);
  } else if(titleTapCount === 15){
    showTitleGagToast("あと5回押したらバランス良くなる", 2000);
  } else if(titleTapCount === 20){
    showTitleGagToast("わけないw", 1600);
    // ここから先はリセットしない。25回目以降も何も表示しない。あ、でも再読込みしたらもちろんリセットされますよ
    titleTapCount = 20;
    return;
  }

  // 20回未満の間だけ、一定時間操作がなければカウントをリセット
  titleTapTimer = setTimeout(() => {
    if(titleTapCount < 20) titleTapCount = 0;
  }, 2800);
});

// ===== Landscape gag =====
function updateLandscapeGag(){
  const landscape = window.matchMedia("(orientation: landscape)").matches;
  if(landscape){
    showShortcutToast("横画面にしたな？\nPCになったわけではありません", 2400);
  }
}

const orientationQuery = window.matchMedia("(orientation: landscape)");
orientationQuery.addEventListener?.("change", updateLandscapeGag);
window.addEventListener("orientationchange", updateLandscapeGag);


render();
startActiveViewTimer();
</script>
