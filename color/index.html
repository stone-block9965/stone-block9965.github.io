<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>色違いを探せ</title>
<style>
:root{
  --bg:#0b1020;
  --panel:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.13);
  --text:#f5f7ff;
  --muted:#aab1c7;
  --accent:#8bb7ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(96,165,250,.18),transparent 35%),
    radial-gradient(circle at 90% 90%,rgba(168,85,247,.18),transparent 38%),
    var(--bg);
  color:var(--text);
  display:grid;
  place-items:center;
  overscroll-behavior:none;
  touch-action:none;
}
button{font:inherit;color:inherit}
.app{width:min(720px,100vw);height:100dvh;display:flex;flex-direction:column;padding:18px max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-bottom:max(16px,env(safe-area-inset-bottom));gap:14px}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title{font-size:clamp(24px,6vw,34px);font-weight:850;letter-spacing:-.03em}
.subtitle{font-size:13px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:8px}
.stat{min-width:72px;padding:9px 11px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;backdrop-filter:blur(18px)}
.stat b{display:block;font-size:20px;line-height:1.05}.stat span{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.card{flex:1;min-height:0;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.075);backdrop-filter:blur(22px) saturate(125%);box-shadow:0 24px 80px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.prompt{font-size:clamp(17px,4.5vw,22px);font-weight:750;text-align:center;margin-bottom:18px}
.prompt small{display:block;margin-top:5px;font-size:12px;color:var(--muted);font-weight:550}
.grid{width:min(82vw,500px);height:min(82vw,500px);max-height:58dvh;display:grid;gap:8px;padding:8px;border-radius:24px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);touch-action:none}
.tile{appearance:none;border:0;border-radius:12px;min-width:0;min-height:0;padding:0;cursor:pointer;touch-action:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 3px 10px rgba(0,0,0,.12);transition:transform .09s ease,filter .09s ease}
.tile:active{transform:scale(.94)}
.tile.good{animation:good .24s ease}
.tile.bad{animation:bad .22s ease}
@keyframes good{50%{transform:scale(.88);filter:brightness(1.4)}}
@keyframes bad{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.bottom{display:flex;justify-content:center;align-items:center;gap:10px;min-height:46px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.10);padding:12px 18px;border-radius:15px;font-weight:750;cursor:pointer;touch-action:manipulation;box-shadow:0 8px 26px rgba(0,0,0,.16)}
.btn:active{transform:scale(.97)}
.btn.primary{background:rgba(139,183,255,.22);border-color:rgba(139,183,255,.38)}
.message{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,8,18,.48);backdrop-filter:blur(12px);z-index:20;padding:22px}
.modal{width:min(460px,100%);padding:28px;border-radius:28px;background:rgba(24,31,55,.86);border:1px solid rgba(255,255,255,.16);box-shadow:0 25px 80px rgba(0,0,0,.42);text-align:center;animation:pop .22s cubic-bezier(.2,.9,.25,1.2)}
@keyframes pop{0%{transform:scale(.84);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{margin:0 0 10px;font-size:30px}.modal p{margin:0 0 22px;color:var(--muted);line-height:1.7}
.hidden{display:none!important}
@media (max-width:540px){
  .app{padding-top:12px;gap:10px}
  .header{align-items:flex-start}.stats{gap:5px}.stat{min-width:58px;padding:7px 8px}.stat b{font-size:17px}
  .card{border-radius:24px;padding:14px}.grid{gap:6px;padding:6px;border-radius:20px;max-height:63dvh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <div class="title">色違いを探せ</div>
      <div class="subtitle">周りと違う色のタイルをタップ！</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>スコア</span></div>
      <div class="stat"><b id="stage">1</b><span>ステージ</span></div>
    </div>
  </header>

  <section class="card">
    <div class="prompt" id="prompt">違う色を1つ見つけよう！<small id="hint">最初は 2×2 から</small></div>
    <div class="grid" id="grid" aria-label="色違いタイルのゲーム盤"></div>
    <div class="bottom">
      <div class="message" id="message">タップするだけでOK</div>
    </div>
  </section>
</main>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h2 id="resultTitle">ゲーム終了</h2>
    <p id="resultText"></p>
    <button class="btn primary" id="restart">もう一回</button>
  </div>
</div>

<script>
(() => {
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const stageEl = document.getElementById('stage');
  const hintEl = document.getElementById('hint');
  const messageEl = document.getElementById('message');
  const overlay = document.getElementById('overlay');
  const resultText = document.getElementById('resultText');
  const restart = document.getElementById('restart');

  let stage = 1;
  let score = 0;
  let locked = false;
  let currentAnswer = -1;
  let startedAt = 0;
  let best = Number(localStorage.getItem('irochigai-best') || 0);

  const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
  const rand = n => Math.floor(Math.random()*n);

  function gridSize(s){
    if(s <= 3) return 2;
    if(s <= 7) return 3;
    if(s <= 12) return 4;
    if(s <= 18) return 5;
    if(s <= 25) return 6;
    if(s <= 33) return 7;
    if(s <= 42) return 8;
    return 9;
  }

  function makeRound(){
    locked = false;
    const size = gridSize(stage);
    const count = size*size;
    currentAnswer = rand(count);
    const hue = rand(360);
    const sat = 65 + rand(20);
    const light = 48 + rand(10);
    // Difficulty rises gradually: the odd tile gets closer to the base color.
    const diff = clamp(27 - stage*0.55, 7, 27);
    const oddLight = clamp(light + (Math.random()<.5 ? -diff : diff), 18, 82);

    grid.style.gridTemplateColumns = `repeat(${size},1fr)`;
    grid.style.gridTemplateRows = `repeat(${size},1fr)`;
    grid.innerHTML = '';

    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.type = 'button';
      tile.dataset.index = i;
      tile.setAttribute('aria-label', 'タイル');
      const l = i === currentAnswer ? oddLight : light;
      tile.style.background = `hsl(${hue} ${sat}% ${l}%)`;
      frag.appendChild(tile);
    }
    grid.appendChild(frag);
    hintEl.textContent = `${size}×${size} ・ 違う色は1つ`;
    startedAt = performance.now();
  }

  function gameOver(){
    best = Math.max(best, score);
    localStorage.setItem('irochigai-best', best);
    resultText.innerHTML = `スコア：<b>${score}</b><br>到達ステージ：<b>${stage}</b><br>ベストスコア：<b>${best}</b>`;
    overlay.classList.remove('hidden');
  }

  function handleTap(tile){
    if(locked) return;
    locked = true;
    const idx = Number(tile.dataset.index);
    const reaction = Math.round(performance.now() - startedAt);

    if(idx === currentAnswer){
      tile.classList.add('good');
      const speedBonus = Math.max(0, Math.floor((1200 - reaction)/100));
      const gained = 100 + stage*10 + speedBonus;
      score += gained;
      stage++;
      scoreEl.textContent = score;
      stageEl.textContent = stage;
      messageEl.textContent = `${reaction} ms！ +${gained}点`;
      setTimeout(makeRound, 170);
    } else {
      tile.classList.add('bad');
      score = Math.max(0, score - 50);
      scoreEl.textContent = score;
      messageEl.textContent = 'はずれ！ −50点';
      // Briefly reveal the answer, then continue at the same stage.
      const answer = grid.querySelector(`[data-index="${currentAnswer}"]`);
      if(answer) answer.classList.add('good');
      setTimeout(() => {
        messageEl.textContent = 'もう一度！';
        makeRound();
      }, 420);
    }
  }

  // Pointer events make tap handling reliable on phones without requiring swipe/scroll gestures.
  grid.addEventListener('pointerdown', e => {
    const tile = e.target.closest('.tile');
    if(!tile) return;
    e.preventDefault();
    handleTap(tile);
  }, {passive:false});

  // Prevent a second activation caused by the synthetic click some browsers emit after touch.
  grid.addEventListener('click', e => e.preventDefault(), {passive:false});

  restart.addEventListener('pointerdown', e => { e.preventDefault(); overlay.classList.add('hidden'); stage=1; score=0; scoreEl.textContent='0'; stageEl.textContent='1'; messageEl.textContent='タップするだけでOK'; makeRound(); }, {passive:false});

  makeRound();
})();
</script>
</body>
</html>
